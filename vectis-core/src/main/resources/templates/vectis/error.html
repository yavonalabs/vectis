<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{vectis/layout :: html(
        pageTitle='Error Encountered',
        content=~{::content}
      )}">
<body>

<div th:fragment="content" class="max-w-2xl mx-auto space-y-6 pt-6">
    <div class="bg-[#0f172a] border border-rose-500/30 rounded-2xl p-8 shadow-2xl space-y-6">
        <div class="flex items-center gap-4">
            <div class="w-12 h-12 rounded-2xl bg-rose-500/10 border border-rose-500/20 flex items-center justify-center text-rose-400 text-2xl font-black shrink-0">
                ?
            </div>
            <div>
                <span class="text-xs font-mono font-bold uppercase tracking-wider text-rose-400" th:text="${'Error ' + (status ?: '500')}">Error 500</span>
                <h2 class="text-xl font-bold tracking-tight text-white mt-0.5" th:text="${errorTitle ?: 'Operation Failed'}">An unexpected server error occurred</h2>
            </div>
        </div>

        <div class="p-4 bg-[#090d16] border border-slate-800 rounded-xl space-y-2">
            <p class="text-xs font-semibold text-slate-300">Message Details:</p>
            <p class="text-xs text-slate-400 font-mono leading-relaxed" th:text="${errorMessage ?: 'An internal server error occurred while processing your request. Please check the logs or try again.'}">
                Error details will appear here.
            </p>
        </div>

        <div class="flex items-center justify-between pt-4 border-t border-slate-800 text-xs">
            <span class="text-slate-500 font-mono" th:text="${'Timestamp: ' + #dates.format(#dates.createNow(), 'yyyy-MM-dd HH:mm:ss')}">Timestamp</span>
            <div class="flex items-center gap-3">
                <a href="/admin" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-slate-950 font-bold rounded-xl transition shadow-lg shadow-emerald-600/20">
                    Return to Dashboard
                </a>
            </div>
        </div>
    </div>
</div>

</body>
</html>
