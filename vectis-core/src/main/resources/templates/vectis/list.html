<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{vectis/layout :: html(
        pageTitle=${descriptor.displayName},
        content=~{::content}
      )}">
<body>

<div th:fragment="content" class="space-y-6">
    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
        <div>
            <h2 class="text-2xl font-bold tracking-tight text-[var(--vx-text-main)]" th:text="${descriptor.displayName}">Entities</h2>
            <p class="text-xs text-[var(--vx-text-muted)] mt-0.5">Find and manage <span th:text="${descriptor.displayName}">entities</span>.</p>
        </div>
    </div>

    <div th:replace="~{vectis/fragments/table :: tableFragment}"></div>
</div>

</body>
</html>
