<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!-- Form Container: htmx will swap this entire block cleanly on validation failure/success -->
<div id="edit-form-container" th:fragment="editFormFragment" class="space-y-6">

    <!-- 1. Global Error Banner -->
    <div th:if="${errorMessage != null}" 
         class="p-4 bg-rose-500/10 border border-rose-500/30 rounded-2xl flex items-start gap-4 animate-in fade-in duration-200">
        <div class="p-2 bg-rose-500/20 rounded-xl text-rose-400">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
        </div>
        <div class="flex-1">
            <h3 class="text-xs font-bold text-rose-400">Attention Required</h3>
            <p class="text-xs text-rose-400/80 mt-0.5 whitespace-pre-line" th:text="${errorMessage}">Please review the highlighted fields below before saving.</p>
        </div>
    </div>

    <!-- 2. Success Banner -->
    <div th:if="${flashMessage != null}" 
         class="p-4 bg-emerald-500/10 border border-emerald-500/30 rounded-2xl flex items-center gap-3 text-emerald-400 animate-in fade-in duration-200">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
        <span class="text-xs font-semibold" th:text="${flashMessage}">Changes saved successfully.</span>
    </div>

    <!-- 3. The Actual Form with htmx in-place swap -->
    <form id="entity-form" 
          th:action="@{'/admin/' + ${descriptor.slug} + '/save'}" 
          method="post" 
          th:attr="hx-post=@{'/admin/' + ${descriptor.slug} + '/save'}"
          hx-target="#edit-form-container"
          hx-swap="outerHTML"
          hx-select="#edit-form-container"
          hx-indicator="#save-btn-spinner"
          class="bg-[var(--vx-surface-card)] border border-[var(--vx-border)] rounded-2xl p-6 md:p-8 shadow-xl shadow-black/20 space-y-6">

        <input th:if="${_csrf != null}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
        <input th:if="${!isNew}" type="hidden" name="__id" th:value="${encodedId}" />
        <input th:if="${descriptor.hasVersion()}" type="hidden" th:name="${descriptor.versionField.name}" th:value="${entity.__${descriptor.versionField.name}__}" />

        <!-- Form Fields Grid -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div th:each="field : ${descriptor.fields}" th:if="${!field.isId() && !field.isVersion()}" class="space-y-2">
                <label th:for="${field.name}" class="block text-xs font-semibold text-[var(--vx-text-muted)] uppercase tracking-wider mb-1.5">
                    <span th:text="${field.displayName}">Field</span>
                    <span th:if="${!field.isNullable()}" class="text-rose-400 ml-0.5">*</span>
                </label>
                <p th:if="${field.description() != null}" class="text-[11px] text-[var(--vx-text-muted)] -mt-1 mb-2" th:text="${field.description()}">Description</p>

                <!-- Boolean Toggle Switch -->
                <div th:if="${field.isBoolean()}" class="flex items-center justify-between bg-[var(--vx-canvas)] p-3 rounded-xl border border-[var(--vx-border)] shadow-inner">
                    <span class="text-xs text-[var(--vx-text-muted)] font-medium">Toggle Status</span>
                    <label class="relative inline-flex items-center cursor-pointer">
                        <input type="checkbox" 
                               th:id="${field.name}" 
                               th:name="${field.name}" 
                               value="true"
                               th:checked="${entity.__${field.name}__ == true}"
                               class="sr-only peer">
                        <div class="w-10 h-5 bg-[var(--vx-surface-overlay)] peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-[var(--vx-canvas)] after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-[var(--vx-text-main)] after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-[var(--vx-accent-main)]"></div>
                    </label>
                </div>

                <!-- Enum Select -->
                <div th:if="${field.isEnum()}">
                    <select th:id="${field.name}" 
                            th:name="${field.name}"
                            class="w-full bg-[var(--vx-canvas)] border border-[var(--vx-border)] rounded-xl px-3.5 py-2.5 text-xs text-[var(--vx-text-main)] shadow-inner focus:outline-none focus:border-[var(--vx-accent-main)] focus:ring-1 focus:ring-[var(--vx-accent-main)]/50 transition">
                        <option value="">-- Select --</option>
                        <option th:each="enumVal : ${field.getEnumConstants()}"
                                th:value="${enumVal}"
                                th:text="${enumVal}"
                                th:selected="${entity.__${field.name}__ != null && entity.__${field.name}__.toString() == enumVal.toString()}"></option>
                    </select>
                </div>

                <!-- Date / Time -->
                <div th:if="${field.isDateOrTime()}">
                    <input type="date"
                           th:id="${field.name}"
                           th:name="${field.name}"
                           th:value="${entity.__${field.name}__}"
                           class="w-full bg-[var(--vx-canvas)] border border-[var(--vx-border)] rounded-xl px-3.5 py-2.5 text-xs text-[var(--vx-text-main)] shadow-inner focus:outline-none focus:border-[var(--vx-accent-main)] focus:ring-1 focus:ring-[var(--vx-accent-main)]/50 transition [color-scheme:dark]">
                </div>

                <!-- Text / Number Input -->
                <div th:if="${!field.isBoolean() && !field.isEnum() && !field.isDateOrTime()}">
                    <input th:type="${field.isNumeric() ? 'number' : (field.validationRules.contains('email') ? 'email' : 'text')}"
                           th:step="${field.isDecimal() ? '0.01' : 'any'}"
                           th:min="${field.min}"
                           th:max="${field.max}"
                           th:id="${field.name}"
                           th:name="${field.name}"
                           th:value="${entity.__${field.name}__}"
                           th:required="${!field.isNullable()}"
                           class="w-full bg-[var(--vx-canvas)] border border-[var(--vx-border)] rounded-xl px-3.5 py-2.5 text-xs text-[var(--vx-text-main)] shadow-inner placeholder-[var(--vx-text-muted)] focus:outline-none focus:border-[var(--vx-accent-main)] focus:ring-1 focus:ring-[var(--vx-accent-main)]/50 transition">
                </div>
            </div>

            <!-- Single-Valued Association Selects -->
            <div th:each="assoc : ${descriptor.associations}" th:if="${assoc.isSingleValued()}" class="space-y-2">
                <label th:for="${assoc.name}" class="block text-xs font-semibold text-[var(--vx-text-muted)] uppercase tracking-wider mb-1.5" th:text="${assoc.displayName}">Department</label>
                <select th:id="${assoc.name}" 
                        th:name="${assoc.name}"
                        class="w-full bg-[var(--vx-canvas)] border border-[var(--vx-border)] rounded-xl px-3.5 py-2.5 text-xs text-[var(--vx-text-main)] shadow-inner focus:outline-none focus:border-[var(--vx-accent-main)] focus:ring-1 focus:ring-[var(--vx-accent-main)]/50 transition">
                    <option value="">-- None --</option>
                    <option th:each="opt : ${formOptions.get(assoc.name)}"
                            th:value="${opt.id}"
                            th:text="${opt.label}"
                            th:selected="${entity.__${assoc.name}__ != null && opt.id == (entity.__${assoc.name}__.__${descriptor.idField.name}__ != null ? entity.__${assoc.name}__.__${descriptor.idField.name}__.toString() : '')}"></option>
                </select>
            </div>
        </div>

        <!-- Mandatory Audit Justification -->
        <div class="space-y-2 pt-4 border-t border-[var(--vx-border)]">
            <div class="flex items-center justify-between mb-2">
                <label for="_reason" class="block text-xs font-semibold text-[var(--vx-accent-main)] flex items-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path></svg>
                    <span>Reason for Change (Audit Record)</span>
                    <span class="text-rose-400">*</span>
                </label>
                <span class="text-[10px] font-mono text-[var(--vx-text-muted)]">Immutable Audit Trail</span>
            </div>
            <input type="text" 
                   id="_reason" 
                   name="_reason" 
                   required
                   placeholder="e.g. Zendesk ticket #1042 - Customer requested promotion update" 
                   class="w-full bg-[var(--vx-canvas)] border border-[var(--vx-border)] rounded-xl px-3.5 py-2.5 text-xs text-[var(--vx-text-main)] shadow-inner placeholder-[var(--vx-text-muted)] focus:outline-none focus:border-[var(--vx-accent-main)] focus:ring-1 focus:ring-[var(--vx-accent-main)]/50 transition">
            <p class="text-[11px] text-[var(--vx-text-muted)] pt-1">All modifications are permanently logged with your operator ID.</p>
        </div>

        <!-- Footer Buttons -->
        <div class="flex items-center justify-end gap-3 pt-6 border-t border-[var(--vx-border)]">
            <a th:href="@{'/admin/' + ${descriptor.slug}}" class="px-4 py-2 bg-[var(--vx-surface-overlay)] hover:bg-[var(--vx-surface-active)] border border-[var(--vx-border)] text-[var(--vx-text-main)] rounded-xl text-xs font-semibold transition">
                Cancel
            </a>
            <button type="submit" id="save-btn" class="px-6 py-2 bg-[var(--vx-accent-main)] hover:bg-[var(--vx-accent-hover)] text-white font-bold rounded-xl text-xs shadow-[0_0_15px_rgba(16,185,129,0.3)] transition flex items-center gap-2">
                <span id="save-btn-spinner" class="htmx-indicator">
                    <svg class="animate-spin h-3.5 w-3.5 text-white" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path></svg>
                </span>
                <span>Save Record</span>
            </button>
        </div>
    </form>
</div>

</body>
</html>
