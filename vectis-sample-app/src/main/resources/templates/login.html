<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="'Login - ' + ${adminTitle}">Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #040508;
            color: #f3f4f6;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center bg-[#040508] relative overflow-hidden">
    <!-- Background Accents -->
    <div class="absolute top-[-20%] left-[-10%] w-[50%] h-[50%] bg-[#10b981]/10 blur-[120px] rounded-full pointer-events-none"></div>
    <div class="absolute bottom-[-20%] right-[-10%] w-[50%] h-[50%] bg-[#3b82f6]/10 blur-[120px] rounded-full pointer-events-none"></div>

    <div class="w-full max-w-sm relative z-10">
        <!-- Logo Header -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-[#10b981]/10 border border-[#10b981]/20 mb-4 shadow-[0_0_15px_rgba(16,185,129,0.15)]">
                <svg class="w-6 h-6 text-[#10b981]" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"></path>
                </svg>
            </div>
            <h1 class="text-2xl font-bold text-white tracking-tight" th:text="${adminTitle}">Vectis Studio</h1>
            <p class="text-xs text-[#9ca3af] mt-1.5 font-medium">Operations Control Plane</p>
        </div>

        <!-- Login Card -->
        <div class="bg-[#0f1117] border border-white/10 rounded-2xl p-6 shadow-2xl backdrop-blur-xl">
            <div th:if="${param.error}" class="mb-4 p-3 bg-rose-500/10 border border-rose-500/20 rounded-xl flex items-start gap-3">
                <svg class="w-4 h-4 text-rose-400 mt-0.5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                <div class="text-xs text-rose-400 font-medium">Invalid username or password.</div>
            </div>
            
            <div th:if="${param.logout}" class="mb-4 p-3 bg-[#10b981]/10 border border-[#10b981]/20 rounded-xl flex items-start gap-3">
                <svg class="w-4 h-4 text-[#10b981] mt-0.5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                <div class="text-xs text-[#10b981] font-medium">You have been logged out.</div>
            </div>

            <form th:action="@{/login}" method="post" class="space-y-4">
                <div class="space-y-1.5">
                    <label for="username" class="block text-xs font-semibold text-[#9ca3af] uppercase tracking-wider">Operator ID</label>
                    <input type="text" id="username" name="username" required autofocus
                           class="w-full bg-[#090a0f] border border-white/10 rounded-xl px-3.5 py-2.5 text-sm text-white placeholder-[#4b5563] focus:outline-none focus:border-[#10b981] focus:ring-1 focus:ring-[#10b981]/50 transition"
                           placeholder="Enter your username">
                </div>

                <div class="space-y-1.5">
                    <label for="password" class="block text-xs font-semibold text-[#9ca3af] uppercase tracking-wider">Passcode</label>
                    <input type="password" id="password" name="password" required
                           class="w-full bg-[#090a0f] border border-white/10 rounded-xl px-3.5 py-2.5 text-sm text-white placeholder-[#4b5563] focus:outline-none focus:border-[#10b981] focus:ring-1 focus:ring-[#10b981]/50 transition"
                           placeholder="••••••••">
                </div>

                <div class="pt-2">
                    <button type="submit" class="w-full bg-[#10b981] hover:bg-[#059669] text-[#090a0f] font-bold rounded-xl py-2.5 text-sm shadow-lg shadow-[#10b981]/20 transition flex items-center justify-center gap-2">
                        Authenticate
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                    </button>
                </div>
            </form>
        </div>

        <div class="text-center mt-6">
            <p class="text-[10px] text-[#4b5563] font-mono">SECURE SYSTEM ACCESS &middot; VECTIS CORE</p>
        </div>
    </div>
</body>
</html>
